<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F0E6">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Personal budget for GCash, Maya, Wise and Landbank. Data stays in your Google Sheet.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Budget</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    try {
      var t = localStorage.getItem('budget.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>

      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></symbol>

      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>

  </svg>

  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app">
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">₱</span><span class="brand-name">Budget</span></a>
      <a class="btn btn-accent side-add" href="#/add" data-nav="add"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg> New entry</a>
      <nav class="side-nav">
        <a href="#/" data-nav="dashboard"><svg class="i" aria-hidden="true"><use href="#i-home"></use></svg><span>Home</span></a>
        <a href="#/transactions" data-nav="transactions"><svg class="i" aria-hidden="true"><use href="#i-list"></use></svg><span>Transactions</span></a>
        <a href="#/review" data-nav="review"><svg class="i" aria-hidden="true"><use href="#i-inbox"></use></svg><span>Review</span><span class="nav-badge" hidden></span></a>
        <a href="#/reports" data-nav="reports"><svg class="i" aria-hidden="true"><use href="#i-chart"></use></svg><span>Reports</span></a>
        <a href="#/settings" data-nav="settings"><svg class="i" aria-hidden="true"><use href="#i-settings"></use></svg><span>Settings</span></a>
      </nav>
      <div class="side-foot">
        <button type="button" class="side-link" data-theme-toggle></button>
        <div class="side-user"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="brand brand-compact" href="#/" aria-label="Budget home"><span class="brand-mark" aria-hidden="true">₱</span></a>
        <span id="page-title" class="topbar-title"></span>
        <div class="topbar-status">
          <span id="net-chip" class="status-chip is-offline" hidden><svg class="i" aria-hidden="true"><use href="#i-cloud-off"></use></svg>Offline</span>
          <button type="button" id="sync-chip" class="status-chip" hidden><svg class="i" aria-hidden="true"><use href="#i-refresh"></use></svg><span></span></button>
        </div>
      </header>
      <div id="reauth" class="reauth" hidden role="status">
        <span><svg class="i" aria-hidden="true"><use href="#i-info"></use></svg> Session paused. Continue to keep syncing.</span>
        <div class="reauth-btn"></div>
      </div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <nav class="bottomnav" aria-label="Main">
      <a href="#/" data-nav="dashboard"><svg class="i" aria-hidden="true"><use href="#i-home"></use></svg><span>Home</span></a>
      <a href="#/transactions" data-nav="transactions"><svg class="i" aria-hidden="true"><use href="#i-list"></use></svg><span>Activity</span></a>
      <a href="#/add" data-nav="add" class="fab" aria-label="Add entry"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg></a>
      <a href="#/review" data-nav="review"><svg class="i" aria-hidden="true"><use href="#i-inbox"></use></svg><span>Review</span><span class="nav-badge" hidden></span></a>
      <button type="button" data-more data-nav="more" data-nav-alt="reports settings"><svg class="i" aria-hidden="true"><use href="#i-more"></use></svg><span>More</span></button>
    </nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Budget needs JavaScript to run.</p></noscript>
</body>
</html>
